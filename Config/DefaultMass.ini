; Mech Sentinel Swarm: UE 5.8.2's UMassReplicationProcessor runs a query it never registered, which the new Mass
; processing queue (mass.UseProcessingQueue, on by default) asserts on as soon as a client is connected ("Query not
; found! Processor attempting to run a query it doesn't own"). UMechSentinelReplicationProcessor does the same work with
; a registered query, so it takes the engine processor's place. Remove both sections once the engine is fixed.
; See MyMechEntitySystemReadme.md, section "Replication".

[/Script/MassReplication.MassReplicationProcessor]
bAutoRegisterWithProcessingPhases=False

[/Script/Aura.MechSentinelReplicationProcessor]
bAutoRegisterWithProcessingPhases=True
